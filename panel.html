<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 过滤层控制</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2128; --muted: #5d6573; --line: #dfe3ea;
    --ok: #18794e; --warn: #9a5b00; --bad: #c4332b; --idle: #6b7280;
    --accent: #2457c5; --on-accent: #ffffff; --soft: #eef2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1e2128; --text: #e8eaee; --muted: #a2a9b6; --line: #333844;
      --ok: #4cc38a; --warn: #f0b34a; --bad: #ff7b72; --idle: #9aa2b1; --accent: #7aa2ff; --on-accent: #10131a; --soft: #262b36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .state { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .state strong { font-size: 18px; }
  .state p { margin: 0; color: var(--muted); font-size: 13px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
  .notice { border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--soft); border-left: 4px solid var(--accent); }
  .notice.warn { border-left-color: var(--warn); } .notice.bad { border-left-color: var(--bad); }
  .notice[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer; min-height: 40px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger { color: var(--bad); border-color: currentColor; margin-left: auto; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre { margin: 12px 0 0; max-height: 280px; overflow: auto; font: 12px/1.5 Consolas, monospace;
    background: var(--bg); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  @media (max-width: 520px) { button.danger { margin-left: 0; } .actions button { flex: 1 1 40%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Codex 过滤层控制</h1>
    <p class="sub">Codex → 过滤层 → CC Switch → 上游</p>
  </header>

  <section class="card" aria-labelledby="state-title">
    <div class="state">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <div>
        <strong id="state-title">读取中…</strong>
        <p id="state-desc"></p>
      </div>
    </div>
    <dl>
      <dt>Codex 当前地址</dt><dd><code id="base-url">-</code></dd>
      <dt>CC Switch</dt><dd id="upstream">-</dd>
      <dt>已过滤请求</dt><dd id="filtered">-</dd>
      <dt>上游错误</dt><dd id="errors">-</dd>
      <dt>最后过滤</dt><dd id="last">-</dd>
    </dl>
  </section>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

  <section class="card" aria-label="操作">
    <div class="actions">
      <button class="primary" id="btn-start" data-api="start">启动过滤</button>
      <button id="btn-stop" data-api="stop">停止过滤</button>
      <button id="btn-restart" data-api="restart">重启过滤</button>
      <button class="danger" id="btn-shutdown">停止全部服务</button>
    </div>
    <p class="hint">启动或停止会改写 Codex 的地址，改完需要完全退出并重新打开 Codex。
      “停止全部服务”会停止过滤层、恢复直连，并关闭本控制面板；不影响 CC Switch 本身。</p>
  </section>

  <details class="card" id="log-box">
    <summary>最近日志</summary>
    <pre id="log">-</pre>
  </details>
</main>
<script>
(() => {
  // The launcher passes the token in the URL; keep it for this tab and clean the address bar.
  const given = new URLSearchParams(location.search).get('t') || location.hash.slice(1);
  if (given) {
    sessionStorage.setItem('panelToken', given);
    history.replaceState(null, '', location.pathname);
  }
  const token = sessionStorage.getItem('panelToken') || '';
  const $ = id => document.getElementById(id);
  const buttons = [...document.querySelectorAll('button')];
  let working = false, closed = false, last = null;

  const STATES = {
    filtering: ['ok', '过滤中', '请求经过滤层转发到 CC Switch。'],
    'waiting-for-ccswitch': ['warn', '等待 CC Switch', '请在 CC Switch 中打开本地代理和 Codex 接管。'],
    'waiting-for-codex-config': ['warn', '等待 Codex 配置', '没有找到 Codex 的 config.toml。'],
    'waiting-for-supported-provider': ['warn', '配置不支持', '没有找到可接管的 provider base_url。'],
    'config-error': ['bad', '配置错误', '接入失败，请看下方提示或日志。'],
    stopping: ['warn', '正在停止', ''],
    'stale-state': ['bad', '进程异常', '记录在但进程无响应，可点“停止过滤”恢复。'],
    stopped: ['idle', '已停止', 'Codex 直连 CC Switch。']
  };

  async function api(name, method = 'GET') {
    const res = await fetch('/api/' + name, {method, headers: {'x-panel-token': token}});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    return data;
  }
  function notice(text, level = '') {
    const el = $('notice');
    el.hidden = !text;
    el.className = 'notice ' + level;
    if (el.textContent !== text) el.textContent = text;
  }
  const time = iso => iso ? new Date(iso).toLocaleString('zh-CN', {hour12: false}) : '-';
  const setText = (id, text) => { if ($(id).textContent !== text) $(id).textContent = text; };

  function render(s) {
    last = s;
    const f = s.filter, key = f.running ? f.state : (f.state === 'stale-state' ? 'stale-state' : 'stopped');
    const [level, title, desc] = STATES[key] || ['warn', f.state, ''];
    $('dot').className = 'dot ' + level;
    setText('state-title', s.busy ? '正在' + s.busy + '…' : title);
    setText('state-desc', f.lastError ? f.lastError : desc);
    setText('base-url', s.codex.baseUrl || '未找到');
    setText('upstream', f.running ? (f.upstream + (f.ccSwitchReachable ? '  可连接' : '  无法连接')) : '-');
    setText('filtered', f.running ? String(f.stats.filteredRequests) : '-');
    setText('errors', f.running ? String(f.stats.upstreamHttpErrors) : '-');
    setText('last', f.running ? time(f.stats.lastFilteredAt) : '-');
    if (!working) {
      if (s.codex.pointsToFilter && !f.running) notice('Codex 指向过滤层，但过滤层没有运行，Codex 会连不上。请点“启动过滤”或“停止过滤”恢复直连。', 'bad');
      else if (f.running && f.state === 'waiting-for-ccswitch') notice('过滤层在待命，CC Switch 没有接管 Codex，当前请求不经过过滤层。', 'warn');
      else if (s.codex.configError) notice('读取 Codex 配置失败：' + s.codex.configError, 'bad');
    }
    updateButtons();
  }
  function updateButtons() {
    const running = !!last?.filter.running;
    $('btn-start').disabled = closed || working || running;
    $('btn-stop').disabled = closed || working || (!running && !last?.codex.pointsToFilter && last?.filter.state === 'stopped');
    $('btn-restart').disabled = closed || working || !running;
    $('btn-shutdown').disabled = closed || working;
  }

  async function refresh() {
    if (closed) return;
    try {
      render(await api('status'));
      if ($('log-box').open) loadLog();
    } catch (error) {
      $('dot').className = 'dot bad';
      setText('state-title', '无法连接控制面板');
      setText('state-desc', '');
      notice(error instanceof TypeError ? '控制面板服务没有运行。请双击“打开控制面板.cmd”。' : error.message, 'bad');
    }
  }
  async function loadLog() {
    try { $('log').textContent = (await api('log')).lines.join('\n') || '暂无日志'; } catch {}
  }

  async function run(name, label) {
    working = true; updateButtons();
    notice('正在' + label + '…');
    try {
      const s = await api(name, 'POST');
      working = false;
      render(s);
      notice(label + '完成。' + (s.routeChanged ? 'Codex 地址已改为 ' + s.codex.baseUrl + '，请完全退出并重新打开 Codex。' : ''), s.routeChanged ? 'warn' : '');
    } catch (error) {
      working = false;
      notice(label + '失败：' + error.message, 'bad');
      refresh();
    }
  }

  $('btn-start').onclick = () => run('start', '启动');
  $('btn-stop').onclick = () => run('stop', '停止');
  $('btn-restart').onclick = () => run('restart', '重启');
  $('btn-shutdown').onclick = async () => {
    if (!confirm('停止过滤层、恢复 Codex 直连，并关闭控制面板？')) return;
    working = true; updateButtons();
    notice('正在停止全部服务…');
    try {
      const r = await api('shutdown', 'POST');
      closed = true; working = false;
      $('dot').className = 'dot';
      setText('state-title', '全部服务已停止');
      setText('state-desc', '可以关闭此页面。需要时再双击“打开控制面板.cmd”。');
      notice(r.restored ? 'Codex 地址已恢复直连，请完全退出并重新打开 Codex。' : '过滤层已停止，Codex 地址无需恢复。', r.restored ? 'warn' : '');
      updateButtons();
    } catch (error) {
      working = false;
      notice('停止失败：' + error.message, 'bad');
      refresh();
    }
  };
  $('log-box').addEventListener('toggle', () => { if ($('log-box').open) loadLog(); });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
